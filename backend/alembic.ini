# Alembic configuration file created for WhatsApp B2B Order Management

[alembic]
# path to migration scripts
script_location = db/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to be to datetime.datetime.now().astimezone()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by the revision environment
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# set to 'false' to disable the automatic generation of
# new migration scripts when model changes are detected
# defaults to 'true'
# compare_model_metadata = true

# set to 'false' to disable comparing type and name of columns,
# enabled by default. This is useful to skip columns with just
# different type representation, while the actual check of the
# parameter will be done in the compared schemas.
# compare_type = true

# compare server default? This is mostly useful for mysql or mariadb. Consider
# examples at the end of alembic/ddl/impl.py and don't enable it here if you
# server default includes special characters you must escape with backslash
# before using in sql or python files.
# compare_server_default=false

# Logging configuration
[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[sqlalchemy]
# the sqlalchemy.url is read from the Settings.database_url environment variable
# via env.py configuration
sqlalchemy.url = %(DATABASE_URL)s
